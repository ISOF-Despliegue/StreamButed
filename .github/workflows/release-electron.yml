name: Release Electron App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: front-streambuted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: release_version
        working-directory: .
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) {
            $version = "${{ github.ref_name }}"
          }
          $version = $version.TrimStart("v")
          if (-not $version) {
            throw "Version is required."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
      - name: Create release tag from manual run
        if: github.event_name == 'workflow_dispatch'
        working-directory: .
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $tag = "${{ steps.release_version.outputs.tag }}"
          $existingTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($existingTag) {
            throw "Tag $tag already exists. Use a new version."
          }
          git tag $tag $env:GITHUB_SHA
          git push origin $tag
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-streambuted/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Set app version from release
        shell: pwsh
        run: |
          npm version --no-git-tag-version ${{ steps.release_version.outputs.version }}
      - name: Build Windows installer
        env:
          VITE_API_BASE_URL: https://api.migueleelg0106.me/api
          VITE_GATEWAY_URL: https://api.migueleelg0106.me
        run: npm run build && npx electron-builder --win --publish never
      - name: Create draft release with installer assets
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          name: StreamButed ${{ steps.release_version.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            front-streambuted/release/*.exe
            front-streambuted/release/*.blockmap
            front-streambuted/release/latest.yml
      - name: Validate release assets and publish
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.create_release.outputs.id }}
          RELEASE_TAG: ${{ steps.release_version.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const releaseId = Number(process.env.RELEASE_ID);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (!releaseId) {
              core.setFailed(`Release id was not returned for ${tag}.`);
              return;
            }

            const { data: release } = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: releaseId,
            });

            const assetNames = release.assets.map((asset) => asset.name);
            const hasInstaller = assetNames.some((name) => name.endsWith(".exe"));
            const hasBlockmap = assetNames.some((name) => name.endsWith(".blockmap"));
            const hasLatestYml = assetNames.includes("latest.yml");

            if (!hasInstaller || !hasBlockmap || !hasLatestYml) {
              core.setFailed(
                `Release ${tag} is missing required assets. Found: ${assetNames.join(", ") || "none"}`
              );
              return;
            }

            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: release.id,
              draft: false,
              prerelease: false,
              make_latest: "true",
            });

            core.info(`Release ${tag} published with assets: ${assetNames.join(", ")}`);
