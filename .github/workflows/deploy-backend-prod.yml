name: Deploy backend to production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escribe DEPLOY para confirmar'
        required: true
        type: string

concurrency:
  group: streambuted-production-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest

    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_PORT }}"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Run production backend deploy
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.DEPLOY_PORT }}" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "bash /opt/streambuted-deploy/deploy-backend-prod.sh"
