name: Security Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Run gitleaks without org license requirement
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect \
            --source=/repo \
            --redact \
            --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - java-kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java sources for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: services/identity-service
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@v3
