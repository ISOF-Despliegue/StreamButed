name: Security Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

jobs:
  node-dependencies:
    name: Node dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - front-streambuted
          - services/catalog-service
          - services/live-service
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        working-directory: ${{ matrix.project }}
        run: npm audit --omit=dev --audit-level=high

  python-dependencies:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - services/media-service
          - services/streaming-service
          - services/analytics-service
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        working-directory: ${{ matrix.project }}
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict --ignore-vuln PYSEC-2025-183

  java-dependencies:
    name: Java dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Ensure Maven wrapper is executable
        run: chmod +x mvnw
      - name: Test Identity Service
        run: ./mvnw -B test
      - name: Cache OWASP Dependency Check data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-data-${{ runner.os }}
      - name: Audit Maven dependencies
        run: |
          ./mvnw -B -DskipTests org.owasp:dependency-check-maven:12.2.2:check \
            -DfailBuildOnCVSS=7 \
            -DskipTestScope=true \
            -DdataDirectory="$HOME/.m2/repository/org/owasp/dependency-check-data" \
            -DnodeAnalyzerEnabled=false \
            -DnodeAuditAnalyzerEnabled=false \
            -DretireJsAnalyzerEnabled=false \
            -DassemblyAnalyzerEnabled=false

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Run gitleaks without org license requirement
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 detect \
            --source=/repo \
            --redact \
            --verbose

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - java-kotlin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Build Java sources for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: services/identity-service
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - uses: github/codeql-action/analyze@v3
